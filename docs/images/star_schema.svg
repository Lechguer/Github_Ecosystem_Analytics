<rect x="72" y="1070" width="1656" height="78" rx="15" fill="#eaf0f7"/><text x="96" y="1102" font-family="Arial" font-size="13" font-weight="700" fill="#3c5672">DIMENSIONS CONFORMES</text><text x="96" y="1128" font-family="Arial" font-size="13" fill="#647a92">dim_repo et dim_contributor sont partagées entre les trois faits. Les faits PR/issues utilisent la version courante du contributeur (is_current = true).</text>
