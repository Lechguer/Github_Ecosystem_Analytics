<rect width="1800" height="1190" fill="#f4f7fb"/><text x="72" y="66" font-family="Arial" font-size="38" font-weight="700" fill="#152b46">Modèle dimensionnel · GitHub Analytics</text><text x="72" y="103" font-family="Arial" font-size="18" fill="#647a92">Trois étoiles de faits reliées par des dimensions conformes · PostgreSQL / dbt</text>
