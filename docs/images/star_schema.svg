<rect x="634" y="220" width="530" height="820" rx="22" fill="#fff" stroke="#dce5ef" stroke-width="2"/><rect x="634" y="220" width="530" height="76" rx="22" fill="#eaf3ff"/><path d="M634 272h530v24H634" fill="#eaf3ff"/><text x="662" y="258" font-size="19" font-weight="700" fill="#22589e">02 · CYCLE DES PULL REQUESTS</text><text x="662" y="280" font-size="12" fill="#6b829b">Étoile transactionnelle</text>
<rect x="1196" y="220" width="532" height="820" rx="22" fill="#fff" stroke="#dce5ef" stroke-width="2"/><rect x="1196" y="220" width="532" height="76" rx="22" fill="#eaf3ff"/><path d="M1196 272h532v24h-532" fill="#eaf3ff"/><text x="1224" y="258" font-size="19" font-weight="700" fill="#22589e">03 · CYCLE DE VIE DES ISSUES</text><text x="1224" y="280" font-size="12" fill="#6b829b">Étoile + bridge many-to-many</text>
