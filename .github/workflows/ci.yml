name: CI

on:
  push:
  pull_request:

jobs:
  dbt:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: github_analytics
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: github_analytics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      DBT_PROFILES_DIR: ci
    defaults:
      run:
        working-directory: dbt_project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r ../requirements-ci.txt
      - name: Seed synthetic raw data
        run: psql "postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@$POSTGRES_HOST:$POSTGRES_PORT/$POSTGRES_DB" -v ON_ERROR_STOP=1 -f ci/seed_raw.sql
      - name: Lint SQL (sqlfluff)
        run: sqlfluff lint models snapshots tests analyses
      - name: dbt build (models, snapshot, tests)
        run: dbt build
      - name: dbt build again (incremental path)
        run: dbt build